name: claude.yml
on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review the PR changes for potential bugs, style issues,
            and adherence to our standards. 
            
            IMPORTANT INSTRUCTIONS FOR POSTING THE REVIEW:
            To preserve Markdown formatting and avoid Bash escaping errors, DO NOT use the --body flag.
            Instead, strictly follow these 2 steps:
            1. Use the 'Write' tool to save your detailed markdown review into a file named 'pr_review.md' in the current directory.
            2. Publish it using the GitHub CLI with this exact command:
               gh pr comment ${{ github.event.pull_request.number }} -F pr_review.md
          claude_args: >-
            --model claude-sonnet-4-6
            --allowed-tools "Write,Read,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *),Bash(gh pr review *),Bash(git *),Bash(rm *)"
          show_full_output: true

        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}