name: claude.yml
on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review the PR changes for potential bugs, style issues,
            and adherence to our standards. 
            
            IMPORTANT: You MUST post your detailed review summary and findings as a general comment on this PR using the GitHub CLI.
            Use the following command:
            gh pr comment ${{ github.event.pull_request.number }} --body "<your detailed review here>"
          claude_args: "--model claude-sonnet-4-6"
          show_full_output: true

        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}