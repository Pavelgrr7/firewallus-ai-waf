name: 'Backend CI (Unit Tests)'
on:
  push:
    branches:
    - 'main'
  pull_request:
    types:
    - 'opened'
    - 'synchronize'
  workflow_dispatch: {}
jobs:
  unit-tests:
    name: 'Run Unit Tests'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Set up Java 21'
      uses: 'actions/setup-java@v4'
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - id: 'step-2'
      name: 'Run Spring Backend Unit Tests'
      run: 'cd spring-backend && chmod +x gradlew && ./gradlew test --no-daemon'
    - id: 'step-3'
      name: 'Upload Test Report'
      uses: 'actions/upload-artifact@v4'
      with:
        name: 'spring-test-report'
        path: 'spring-backend/build/reports/tests/test/'
      if: 'always()'
