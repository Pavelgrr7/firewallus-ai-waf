name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Инициализация сканера CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Set up JDK 21
      if: matrix.build-mode == 'manual'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Kotlin & Java Microservices
      if: matrix.build-mode == 'manual'
      env:
        GRADLE_OPTS: "-Xmx2048m -XX:+UseParallelGC"
      run: |
        echo "Building Ktor Gateway..."
        cd ktor-service && chmod +x gradlew && ./gradlew classes --no-daemon -Dkotlin.daemon.jvmargs="-Xmx2560m"
        cd ..
        
        echo "Building Spring Boot Core..."
        cd spring-backend && chmod +x gradlew && ./gradlew classes --no-daemon -Dkotlin.daemon.jvmargs="-Xmx2560m"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
