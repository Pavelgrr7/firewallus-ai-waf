name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Инициализация сканера CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Set up JDK 21
      if: matrix.build-mode == 'manual'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Kotlin & Java Microservices
      if: matrix.build-mode == 'manual'
      run: |
        echo "1. Создаем глобальную конфигурацию памяти для Gradle и Kotlin"
        mkdir -p ~/.gradle
        cat << 'EOF' > ~/.gradle/gradle.properties
        org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC
        kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC -XX:-UseGCOverheadLimit
        EOF

        echo "2. Сборка Ktor Gateway"
        cd ktor-service
        chmod +x gradlew
        ./gradlew classes --no-daemon
        cd ..
        
        echo "3. Сборка Spring Boot Core"
        cd spring-backend
        chmod +x gradlew
        ./gradlew classes --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
