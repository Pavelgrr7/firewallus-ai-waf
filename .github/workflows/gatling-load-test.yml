name: 'Gatling Load Test'
on:
  push:
    branches:
    - 'main'
    - 'dev'
    - 'chore/fix-gatling-1-spammer-issue'
  workflow_dispatch: {}
jobs:
  run-gatling:
    name: 'Run Load Tests'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Set up Java 21'
      uses: 'actions/setup-java@v4'
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - id: 'step-2'
      name: 'Set up Docker Buildx'
      uses: 'docker/setup-buildx-action@v3'
    - id: 'step-3'
      name: 'Start infrastructure'
      env:
        POSTGRES_USER: '${{ secrets.POSTGRES_USER }}'
        POSTGRES_PASSWORD: '${{ secrets.POSTGRES_PASSWORD }}'
        DEFAULT_ADMIN_USERNAME: '${{ secrets.DEFAULT_ADMIN_USERNAME }}'
        DEFAULT_ADMIN_PASSWORD: '${{ secrets.DEFAULT_ADMIN_PASSWORD }}'
        JWT_SECRET: '${{ secrets.JWT_SECRET }}'
        DEFAULT_KAFKA: '${{ secrets.DEFAULT_KAFKA }}'
        DEFAULT_REDIS_HOST: '${{ secrets.DEFAULT_REDIS_HOST }}'
        DEFAULT_REDIS_PORT: '${{ secrets.DEFAULT_REDIS_PORT }}'
        SEED_DEFAULT_RULES: '${{ secrets.SEED_DEFAULT_RULES }}'
        TARGET_PORT: '8080'
        WAF_DEFAULT_TARGET_URL: 'http://target-backend:8080'
        WAF_DEFAULT_RATE_LIMIT_REQUESTS: '100'
        WAF_DEFAULT_RATE_LIMIT_WINDOW: '60'
      run: 'docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait'
    - id: 'step-4'
      name: 'Run Gatling Tests'
      run: 'cd ktor-service && chmod +x gradlew && ./gradlew gatlingRun --no-daemon -Dorg.gradle.jvmargs=-Xmx512m'
    - id: 'step-5'
      name: 'Upload Gatling Report'
      uses: 'actions/upload-artifact@v4'
      with:
        name: 'gatling-report'
        path: 'ktor-service/build/reports/gatling/'
      if: 'always()'
