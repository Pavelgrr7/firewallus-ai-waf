name: 'Gatling Load Test'
on:
  push:
    branches:
    - 'main'
  workflow_dispatch: {}
jobs:
  run-gatling:
    name: 'Run Load Tests'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Set up Java 21'
      uses: 'actions/setup-java@v4'
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - id: 'step-2'
      name: 'Start infrastructure'
      env:
        WAF_DEFAULT_RATE_LIMIT_REQUESTS: '100'
        WAF_DEFAULT_RATE_LIMIT_WINDOW: '60'
      run: 'docker compose up -d --wait'
    - id: 'step-3'
      name: 'Run Gatling Tests'
      run: 'chmod +x gradlew && ./gradlew gatlingRun --no-daemon'
    - id: 'step-4'
      name: 'Upload Gatling Report'
      uses: 'actions/upload-artifact@v4'
      with:
        name: 'gatling-report'
        path: 'ktor-service/build/reports/gatling/'
      if: 'always()'
