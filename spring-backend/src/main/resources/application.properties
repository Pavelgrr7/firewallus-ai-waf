spring.application.name=init-spring-fw-ai
spring.datasource.url=jdbc:postgresql://postgres:5432/mydatabase
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
spring.flyway.fail-on-missing-locations=true
spring.threads.virtual.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=FEMLFN3LJNR3JLRJFKNLNM
app.default-admin.username=${DEFAULT_ADMIN_USERNAME}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD}