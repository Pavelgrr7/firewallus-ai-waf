# ТОЛЬКО настройки для GitHub Actions
services:
  backend-spring:
    build:
      cache_from:
        - type=gha,scope=spring
      cache_to:
        - type=gha,mode=max,scope=spring
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m

  ktor-service:
    build:
      cache_from:
        - type=gha,scope=ktor
      cache_to:
        - type=gha,mode=max,scope=ktor
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m

  admin-frontend:
    profiles:
      - donotstart

  notification-service:
    profiles:
      - donotstart

  dbgate:
    profiles:
      - donotstart

  kafka:
    environment:
      - KAFKA_HEAP_OPTS=-Xmx256m -Xms256m

  target-backend:
    image: nginx:alpine
    environment:
      - TARGET_PORT=${TARGET_PORT:-8080}
    command: >
      /bin/sh -c "echo \"server { listen ${TARGET_PORT:-8080}; location / { default_type text/plain; return 200 'Mock Backend OK'; } }\" > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${TARGET_PORT:-8080}/ || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
